name: ci

on:
  push:
  pull_request:

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # Install the api + models + eval extras so the FastAPI, retriever and
        # metrics tests actually run (previously skipped). The model boundaries
        # are still mocked in the tests, so no model weights are downloaded at
        # test time; sentence-transformers is present only so imports resolve.
        run: pip install -e ".[api,models,eval]" pytest

      - name: Run tests
        run: python -m pytest -rs

      - name: Run eval (v1)
        run: PYTHONPATH=src python -m eval.harness

      - name: Show v1 eval results
        run: cat eval/results.json

      - name: Leakage gate (fails if any test item >= 0.9 similar to train/examples)
        run: PYTHONPATH=src python -m data.overlap_check

      - name: Run eval (v2 offline subset)
        # System A runs; Systems B/C need real models and are marked
        # "pending real run" here. No model download in CI.
        run: PYTHONPATH=src python -m eval.harness_v2

      - name: Show v2 eval results
        run: cat eval/results-v2.json
