[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "written-channel-triage"
version = "0.1.0"
description = "Secure triage agent for written customer support at a fictional German telco (synthetic data only)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mir Mansoor Ahmed" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# Real-model path (V1-V4): local SLM over HTTP + multilingual embeddings.
models = ["httpx>=0.27", "numpy>=1.24", "sentence-transformers>=2.2"]
# Eval artifacts (V11-V16): metrics + confusion-matrix PNG.
eval = ["numpy>=1.24", "matplotlib>=3.7", "scikit-learn>=1.3"]
# Delivery surface (V28): FastAPI POST /triage.
api = ["fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
